name: Test, publish image and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dind-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - name: Test DinD and agent over SSH
        run: tests/smoke.sh
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test standalone release configuration
        run: |
          docker compose version
          python -m pip install PyYAML==6.0.3
          python scripts/export-release-compose.py "$RUNNER_TEMP/docker-compose.yml"
          DIND_SMOKE_RELEASE_FILE="$RUNNER_TEMP/docker-compose.yml" tests/smoke.sh

  publish:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=agents-in-docker-with-dind
            org.opencontainers.image.description=Run coding agents over SSH with their own Docker-in-Docker daemon.
            org.opencontainers.image.url=https://github.com/sigmalko/agents-in-docker-with-dind
            org.opencontainers.image.documentation=https://github.com/sigmalko/agents-in-docker-with-dind#readme
            org.opencontainers.image.source=https://github.com/sigmalko/agents-in-docker-with-dind
            org.opencontainers.image.vendor=sigmalko
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish amd64 and arm64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [test, publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Export standalone configuration and create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.3
          python scripts/export-release-compose.py "$RUNNER_TEMP/docker-compose.yml"
          image="ghcr.io/${REPOSITORY,,}:${RELEASE_TAG#v}"
          sed -e '/^IMAGE=/d' -e "s|^DIND_IMAGE=.*|DIND_IMAGE=$image|" .env.example > "$RUNNER_TEMP/env.example"
          sed "s/RELEASE_TAG/$RELEASE_TAG/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/docker-compose.yml" "$RUNNER_TEMP/env.example" \
            --repo "$REPOSITORY" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
